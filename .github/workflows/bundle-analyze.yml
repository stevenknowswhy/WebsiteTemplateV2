name: Bundle Analyze
on:
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm i --frozen-lockfile
      - run: ANALYZE=true pnpm build
      - name: Upload analyze report
        uses: actions/upload-artifact@v4
        with:
          name: next-analyze
          path: .next/analyze